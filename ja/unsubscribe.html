<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://subscribe.ko-72.com; img-src 'self' data:; base-uri 'none'; form-action 'self'">
<title>Kō — 配信停止</title>
<link rel="alternate" hreflang="en" href="https://ko-72.com/unsubscribe.html">
<link rel="alternate" hreflang="ja" href="https://ko-72.com/ja/unsubscribe.html">
<link rel="alternate" hreflang="x-default" href="https://ko-72.com/unsubscribe.html">
<link rel="stylesheet" href="/unsubscribe.css">
</head>
<body data-language="ja">
<div class="card">
  <p class="logo">Kō<span class="kanji">候</span></p>
  <section class="view" id="request-view">
    <h1>配信停止</h1>
    <p>メールアドレスを入力すると確認リンクをお送りします。メール内で確認するまで配信設定は変更されません。</p>
    <form id="request-form">
      <input type="email" id="email" autocomplete="email" placeholder="your@email.com" required>
      <button type="submit" data-label="確認リンクを送信">確認リンクを送信</button>
    </form>
    <p class="msg success" id="request-success" role="status" aria-live="polite" hidden>登録済みのアドレスの場合、確認リンクを送信しました。リンクは30分間有効です。</p>
    <p class="msg error" id="request-error" role="alert" hidden>問題が発生しました。もう一度お試しください。</p>
  </section>
  <section class="view" id="confirm-view" hidden>
    <h1>配信停止の確認</h1>
    <p>Kō の配信停止を確定します。購読履歴は保持されます。</p>
    <form id="confirm-form">
      <button type="submit" data-label="配信停止を確定">配信停止を確定</button>
    </form>
    <p class="msg success" id="confirm-success" role="status" aria-live="polite" hidden>配信停止が完了しました。今後 Kō の便りは届きません。</p>
    <p class="msg error" id="confirm-error" role="alert" hidden>確認リンクが無効か、有効期限が切れています。下から新しいリンクをリクエストしてください。</p>
  </section>
  <br>
  <a href="https://ko-72.com/ja/">← ko-72.com へ戻る</a>
  <a class="lang-switch" href="https://ko-72.com/unsubscribe.html" hreflang="en" lang="en">English</a>
</div>

<script src="/unsubscribe.js" defer></script>
</body>
</html>
